name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run test

      # Ловим ошибки прод-сборки (напр. падение prerender-а) до того, как CD дёрнет
      # деплой на Vercel — deploy.yml триггерится по факту зелёного CI. Витринные
      # страницы динамические (force-dynamic), поэтому реальная БД сборке не нужна —
      # фейковой строки хватает, чтобы Prisma-клиент инициализировался.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Сквозной сценарий (пункт 36) доходит до реального POST /api/orders → Prisma,
    # поэтому e2e-джобе нужна своя БД. Одноразовый Postgres в контейнере, не Neon.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coffee_bakery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coffee_bakery_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/coffee_bakery_test
      # Учётка админа: prisma db seed создаёт её из этих переменных, а
      # e2e/admin-order.spec.ts под ней логинится в /pekarnya-control.
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-admin-password-123
      NEXTAUTH_SECRET: ci-only-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Схема + данные из menu.json в одноразовую БД, чтобы каталог и создание заказа работали.
      - run: npx prisma migrate deploy
      - run: npx prisma db seed

      # Без --with-deps: ubuntu-latest-раннеры GitHub Actions уже несут нужные системные
      # библиотеки для Chromium. --with-deps дёргает apt-get, который однажды завис на 6
      # часов на зеркале noble-security и был убит только дефолтным лимитом job (см.
      # docs/progress.md, задача 47) — apt тут не нужен и небезопасен по времени выполнения.
      - run: npx playwright install chromium

      - run: npm run test:e2e

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
