name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Без --with-deps: ubuntu-latest-раннеры GitHub Actions уже несут нужные системные
      # библиотеки для Chromium. --with-deps дёргает apt-get, который однажды завис на 6
      # часов на зеркале noble-security и был убит только дефолтным лимитом job (см.
      # docs/progress.md, задача 47) — apt тут не нужен и небезопасен по времени выполнения.
      - run: npx playwright install chromium

      - run: npm run test:e2e

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
