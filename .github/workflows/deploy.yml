name: Deploy

# CD: срабатывает ПОСЛЕ того, как workflow "CI" завершился на ветке main.
# workflow_run даёт доступ к результату CI — если тесты упали, деплой не стартует.
# Порядок внутри джобы: сначала миграции против прод-БД, потом — триггер деплоя кода
# на Vercel (авто-деплой Vercel на main выключен через vercel.json).
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

# Не запускать два прод-деплоя параллельно. cancel-in-progress: false —
# начатый деплой (особенно шаг миграций) прерывать нельзя.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Только успешный CI и только реальный пуш в main (не прогон CI на PR-ветке).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    permissions:
      contents: read
    steps:
      # Берём ровно тот коммит, который проверил CI, а не «просто HEAD main».
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Применяем миграции к прод-БД по прямому (не пуллерному) соединению.
      # prisma.config.ts берёт datasource.url из process.env.DIRECT_URL.
      # migrate deploy идемпотентен: если новых миграций нет — просто выходит 0.
      - name: Apply Prisma migrations
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      # Миграции прошли — теперь можно катить новый код.
      # Deploy Hook на ветку main → продакшн-деплой на Vercel.
      - name: Trigger Vercel production deploy
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
